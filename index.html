<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>spacebots -the last survivors</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0f172a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
            overflow: hidden;
            user-select: none;
        }

        .game-container {
            position: relative;
        }

        #gameCanvas {
            background-color: #1e293b;
            border: 4px solid #38bdf8;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.3);
            cursor: crosshair;
            display: block;
        }

        .ui-bar {
            position: absolute;
            top: 15px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            font-weight: bold;
            pointer-events: none;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .ui-bar span {
            color: #38bdf8;
        }

        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.92);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 12px;
        }

        #game-over-screen h1 {
            font-size: 42px;
            color: #ef4444;
            margin-bottom: 10px;
            text-shadow: 0 0 15px rgba(239, 68, 68, 0.6);
        }

        #game-over-screen p {
            font-size: 22px;
            margin-bottom: 25px;
        }

        .btn {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 14px 36px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
        }

        .btn:hover {
            background: #ffffff;
            transform: scale(1.08);
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.8);
        }
    </style>
</head>
<body>

    <div class="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        
        <div class="ui-bar">
            <div>Score: <span id="score">0</span></div>
            <div>Levensduur Mens: <span id="health">100</span>%</div>
        </div>

        <div id="game-over-screen">
            <h1>OVERRONNEN DOOR ROBOTS!</h1>
            <p>Robots uitgeschakeld: <span id="final-score">0</span></p>
            <button class="btn" onclick="startGame()">Herstart Gevecht</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const healthEl = document.getElementById('health');
        const finalScoreEl = document.getElementById('final-score');
        const gameOverScreen = document.getElementById('game-over-screen');

        let gameRunning = false;
        let score = 0;
        let health = 100;
        let animationFrameId;
        let spawnInterval;

        // Muis positie
        const mouse = { x: canvas.width / 2, y: canvas.height / 2 };

        // Besturing
        const keys = { 
            w: false, a: false, s: false, d: false,
            ArrowUp: false, ArrowLeft: false, ArrowDown: false, ArrowRight: false 
        };

        // Speler (Menselijke Held)
        const player = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            radius: 16,
            speed: 4.5,
            angle: 0
        };

        let bullets = [];
        let robots = [];

        // Muis & Toetsenbord Luisteraars
        window.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouse.x = e.clientX - rect.left;
            mouse.y = e.clientY - rect.top;
        });

        window.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() in keys) keys[e.key.toLowerCase()] = true;
            if (e.key in keys) keys[e.key] = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.key.toLowerCase() in keys) keys[e.key.toLowerCase()] = false;
            if (e.key in keys) keys[e.key] = false;
        });

        canvas.addEventListener('mousedown', () => {
            if (gameRunning) shoot();
        });

        function startGame() {
            score = 0;
            health = 100;
            bullets = [];
            robots = [];
            player.x = canvas.width / 2;
            player.y = canvas.height / 2;

            scoreEl.innerText = score;
            healthEl.innerText = health;
            gameOverScreen.style.display = 'none';
            gameRunning = true;

            clearInterval(spawnInterval);
            spawnInterval = setInterval(spawnRobot, 1000); // Elke seconde een robot

            cancelAnimationFrame(animationFrameId);
            gameLoop();
        }

        // Kogel schieten richting muiscursor
        function shoot() {
            const angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
            bullets.push({
                x: player.x,
                y: player.y,
                vx: Math.cos(angle) * 12,
                vy: Math.sin(angle) * 12,
                radius: 4
            });
        }

        // Maak een robot aan de rand van de kaart
        function spawnRobot() {
            let x, y;
            if (Math.random() < 0.5) {
                x = Math.random() < 0.5 ? -30 : canvas.width + 30;
                y = Math.random() * canvas.height;
            } else {
                x = Math.random() * canvas.width;
                y = Math.random() < 0.5 ? -30 : canvas.height + 30;
            }

            robots.push({
                x: x,
                y: y,
                size: 28,
                speed: 1.5 + Math.random() * 1.5,
                health: 2 // Heeft 2 schoten nodig
            });
        }

        function update() {
            if (!gameRunning) return;

            // Speler bewegen
            if ((keys.w || keys.ArrowUp) && player.y > player.radius) player.y -= player.speed;
            if ((keys.s || keys.ArrowDown) && player.y < canvas.height - player.radius) player.y += player.speed;
            if ((keys.a || keys.ArrowLeft) && player.x > player.radius) player.x -= player.speed;
            if ((keys.d || keys.ArrowRight) && player.x < canvas.width - player.radius) player.x += player.speed;

            // Hoek naar muis berekenen
            player.angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);

            // Kogels updaten
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.x += b.vx;
                b.y += b.vy;

                if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
                    bullets.splice(i, 1);
                }
            }

            // Robots updaten en botsingen checken
            for (let rIndex = robots.length - 1; rIndex >= 0; rIndex--) {
                const r = robots[rIndex];
                
                // Robot rent richting de mens
                const angle = Math.atan2(player.y - r.y, player.x - r.x);
                r.x += Math.cos(angle) * r.speed;
                r.y += Math.sin(angle) * r.speed;

                // Kogel vs Robot
                for (let bIndex = bullets.length - 1; bIndex >= 0; bIndex--) {
                    const b = bullets[bIndex];
                    const dist = Math.hypot(b.x - r.x, b.y - r.y);

                    if (dist < r.size / 2 + b.radius) {
                        bullets.splice(bIndex, 1);
                        r.health--;

                        if (r.health <= 0) {
                            robots.splice(rIndex, 1);
                            score += 10;
                            scoreEl.innerText = score;
                        }
                        break;
                    }
                }

                // Robot vs Mens (Speler)
                const distPlayer = Math.hypot(player.x - r.x, player.y - r.y);
                if (distPlayer < player.radius + r.size / 2) {
                    health -= 10;
                    healthEl.innerText = Math.max(0, health);
                    robots.splice(rIndex, 1);

                    if (health <= 0) {
                        gameOver();
                    }
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Raster achtergrond
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 1;
            for (let x = 0; x < canvas.width; x += 40) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += 40) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            // Lasers/Kogels
            ctx.fillStyle = '#38bdf8';
            ctx.shadowBlur = 8;
            ctx.shadowColor = '#38bdf8';
            bullets.forEach(b => {
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.shadowBlur = 0; // Reset gloei effect

            // Mens (Speler)
            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.rotate(player.angle);
            
            // Lichaam van de mens
            ctx.fillStyle = '#f59e0b'; // Oranje/mens outfit
            ctx.beginPath();
            ctx.arc(0, 0, player.radius, 0, Math.PI * 2);
            ctx.fill();

            // Hoofd
            ctx.fillStyle = '#ffedd5';
            ctx.beginPath();
            ctx.arc(0, 0, 8, 0, Math.PI * 2);
            ctx.fill();
            
            // Laser Wapen
            ctx.fillStyle = '#64748b';
            ctx.fillRect(6, 4, 16, 5);
            ctx.restore();

            // Robots (Vijanden)
            robots.forEach(r => {
                ctx.save();
                ctx.translate(r.x, r.y);

                // Metaal chassis
                ctx.fillStyle = '#ef4444';
                ctx.fillRect(-r.size / 2, -r.size / 2, r.size, r.size);

                // Pantser rand
                ctx.strokeStyle = '#991b1b';
                ctx.lineWidth = 2;
                ctx.strokeRect(-r.size / 2, -r.size / 2, r.size, r.size);

                // Lichtgevende Robotogen
                ctx.fillStyle = '#facc15';
                ctx.fillRect(-8, -6, 5, 5);
                ctx.fillRect(3, -6, 5, 5);

                ctx.restore();
            });
        }

        function gameLoop() {
            update();
            draw();
            if (gameRunning) {
                animationFrameId = requestAnimationFrame(gameLoop);
            }
        }

        function gameOver() {
            gameRunning = false;
            clearInterval(spawnInterval);
            finalScoreEl.innerText = score;
            gameOverScreen.style.display = 'flex';
        }

        // Start het spel direct
        startGame();
    </script>
</body>
</html>
