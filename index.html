<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpaceBots - The Last Survivors</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="app">

    <!-- STARTMENU -->
    <div id="menu" class="screen">

        <div class="logo">
            SPACE<span>BOTS</span>
        </div>

        <div class="subtitle">
            THE LAST SURVIVORS
        </div>

        <div class="menu-card">

            <button id="startBtn" class="main-btn">
                ▶ START GAME
            </button>

            <p>
                WASD / pijltjes = bewegen
            </p>

            <p>
                Muis = richten · Klik = schieten
            </p>

            <p>
                1 / 2 / 3 = wapen kiezen · P = pauze
            </p>

        </div>

    </div>


    <!-- GAME -->
    <div id="game" class="hidden">

        <canvas
            id="gameCanvas"
            width="1000"
            height="650">
        </canvas>


        <!-- HUD -->
        <div class="hud">

            <div class="hud-box">
                ⭐ SCORE
                <b id="score">0</b>
            </div>

            <div class="hud-box">
                WAVE
                <b id="wave">1</b>
            </div>

            <div class="health">

                <span>❤️</span>

                <div class="health-track">
                    <i id="healthFill"></i>
                </div>

                <b id="healthText">
                    100
                </b>

            </div>

            <div class="hud-box">
                🔫
                <b id="weaponName">
                    BLASTER
                </b>
            </div>

        </div>


        <!-- WAPENS -->
        <div id="weaponBar">

            <button data-w="0">
                1 · BLASTER
            </button>

            <button data-w="1">
                2 · SPREAD
            </button>

            <button data-w="2">
                3 · PLASMA
            </button>

        </div>


        <!-- PAUZE -->
        <div id="pause" class="overlay hidden">

            <h2>PAUZE</h2>

            <p>
                Druk op P om verder te gaan
            </p>

        </div>


        <!-- GAME OVER -->
        <div id="gameOver" class="overlay hidden">

            <h1>
                GAME OVER
            </h1>

            <p>
                Robots uitgeschakeld:
                <b id="finalScore">0</b>
            </p>

            <p>
                Highscore:
                <b id="finalHighscore">0</b>
            </p>

            <button
                id="restartBtn"
                class="main-btn">
                ↻ OPNIEUW
            </button>

        </div>

    </div>

</div>

<script src="app.js"></script>

</body>
</html>
